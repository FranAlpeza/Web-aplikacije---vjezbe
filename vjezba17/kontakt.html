<!DOCTYPE html>
<html lang="hr">
  <head>
    <meta charset="UTF-8" />
    <title>Moja prva stranica – Header</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Lobster&display=swap"
    />
    <style>
      /* OVDJE ĆETE DODATI SVOJ CSS KOD */
      /* 1. Reset osnovnih margina i paddinga za sve elemente */
      * {
        /* ovdje idu deklaracije za margin i padding */
        margin: 0;
        padding: 0;
      }

      :root {
        --primary: #1e5bb8;
        --primary-dark: #174a94;
        --secondary: #ffcc00;
        --neutral-bg: #f0f0f0;
        --neutral-text: #333333;
        --neutral-muted: #555555;
        --neutral-border: #cccccc;
        --form-border: #b5b5b5;
        --white: #ffffff;
      }

      /* 2. Osnovni stil za cijelu stranicu */
      body {
        /* ovdje idu deklaracije za font i pozadinsku boju stranice */
        font-family: "Roboto", Arial, sans-serif;
        background-color: var(--neutral-bg);
        color: var(--neutral-text);
      }

      /* 3. Header dio stranice */
      header {
        /* ovdje idu deklaracije za pozadinsku boju, border, margin i padding */
        background-color: var(--white);
        border: 1px solid var(--neutral-border);
        margin: 20px;
        padding: 10px;
      }

      /* 4. Banner slika unutar headera */
      .banner img {
        /* ovdje idu deklaracije za širinu slike i da nema razmaka ispod slike */
        width: 100%;
        display: block;
        border-bottom: 3px solid var(--secondary);
      }

      /* 5. Navigacija ispod bannera */
      nav {
        /* ovdje idu deklaracije za pozadinsku boju navigacije, padding i gornji margin */
        background-color: var(--neutral-text);
        padding: 8px;
        margin-top: 10px;
      }

      /* 6. Lista u navigaciji */
      ul {
        /* ovdje idu deklaracije za list-style, margin i padding */
        list-style-type: none;
        margin: 0;
        padding: 0;
        text-align: center;
      }

      /* 7. Stavke liste u navigaciji */
      li {
        /* ovdje idu deklaracije za prikaz u jednom redu i razmak desno */
        display: inline-block;
        margin-right: 15px;
      }

      /* 8. Linkovi u navigaciji */
      a {
        /* ovdje idu deklaracije za text-decoration, boju teksta, border, padding i veličinu fonta */
        text-decoration: none;
        color: var(--white);
        border: 1px solid var(--white);
        padding: 5px 12px;
        font-size: 14px;
      }

      /* 9. Glavni sadržaj (main) */
      main {
        /* ovdje idu deklaracije za pozadinsku boju, border, margin i padding */
        background-color: var(--white);
        border: 1px solid var(--neutral-border);
        margin: 0 20px 20px 20px;
        padding: 10px;
      }

      /* 10. Tekst u glavnom sadržaju */
      main p {
        /* ovdje ide deklaracija za razmak između redova (line-height) */
        line-height: 1.2;
      }

      /* 11. Footer */
      footer {
        /* ovdje idu deklaracije za poravnanje teksta, veličinu fonta, boju teksta i donji margin */
        text-align: center;
        font-size: 12px;
        color: var(--neutral-muted);
        margin-bottom: 10px;
      }

      .kontakt-forma {
        margin-top: 24px;
        background-color: var(--white);
        padding: 32px;
        border: 2px solid var(--secondary);
        border-radius: 8px;
      }

      h1 {
        font-size: 24px;
        font-weight: bold;
        font-family: "Lobster", "Georgia", serif;
      }

      h2 {
        font-size: 16px;
        font-weight: normal;
        margin-top: 12px;
        font-family: "Lobster", "Georgia", serif;
      }

      form {
        margin-top: 24px;
        margin-left: 48px;
      }

      form div {
        margin-bottom: 16px;
      }

      label {
        display: block;
        margin-bottom: 4px;
        font-weight: bold;
      }

      input,
      select,
      textarea {
        width: 100%;
        padding: 8px;
        border: 2px solid var(--form-border);
      }

      textarea {
        height: 80px;
      }

      input:focus,
      select:focus,
      textarea:focus,
      button:focus {
        border: 2px solid var(--primary);
        outline: none;
      }

      .newsletter {
        width: auto;
      }

      .newsletter + label {
        display: inline;
      }

      .newsletter:checked + label {
        color: var(--primary);
      }

      input:disabled {
        background: #e5e5e5;
        color: #777;
      }

      input:enabled {
        background: #fff;
      }

      button {
        background-color: var(--primary);
        padding: 8px 16px;
        border-radius: 8px;
        border: 1px solid var(--primary);
        color: var(--white);
      }

      button:hover {
        background-color: var(--primary-dark);
        box-shadow: 0 4px 8px rgba(30, 91, 184, 0.25);
      }
    </style>
  </head>
  <body>
    <header>
      <div class="banner">
        <img src="lego_banner.jpg" alt="Lego" />
      </div>

      <nav class="main-nav">
        <ul>
          <li><a href="index.html">Početna</a></li>
          <li><a href="#">O nama</a></li>
          <li><a href="#">Usluge</a></li>
          <li><a href="kontakt.html">Kontakt</a></li>
          <li><a href="galerija.html">Galerija</a></li>
          <li><a href="https://www.lego.com" target="_blank">LEGO</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <div class="kontakt-forma">
        <h1>Kontaktirajte nas - LEGO podrška</h1>
        <h2>
          Ako imate pitanja o svom LEGO setu, ispunite kontakt obrazac u
          nastavku
        </h2>

        <form>
          <div>
            <label for="ime">Ime *</label>
            <input
              type="text"
              id="ime"
              name="ime"
              placeholder="Vaše ime..."
              required
            />
          </div>

          <div>
            <label for="prezime">Prezime *</label>
            <input
              type="text"
              id="prezime"
              name="prezime"
              placeholder="Vaše prezime..."
              required
            />
          </div>

          <div>
            <label for="email">Vaš e-mail *</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="Vaš email..."
              required
            />
          </div>

          <div>
            <label for="drzava">Država:</label>
            <select id="drzava" name="drzava">
              <option value="">Odaberite državu</option>
              <option value="hr">Hrvatska</option>
              <option value="si">Slovenija</option>
              <option value="at">Austrija</option>
              <option value="de">Njemačka</option>
            </select>
          </div>

          <div>
            <label for="poruka">Poruka:</label>
            <textarea
              id="poruka"
              name="poruka"
              placeholder="Vaša poruka..."
            ></textarea>
          </div>

          <div>
            <input
              id="newsletter"
              type="checkbox"
              name="newsletter"
              class="newsletter"
            />
            <label for="newsletter">Želim primati newsletter</label>
          </div>

          <div>
            <label for="dostava">Način dostave:</label>
            <select id="dostava" name="dostava">
              <option value="">Odaberite način dostave</option>
              <option value="posta">Pošta</option>
              <option value="kurir">Kurirska služba</option>
              <option value="osobno">Osobno preuzimanje</option>
            </select>
          </div>

          <div>
            <label for="promo">Promo kod:</label>
            <input
              type="text"
              id="promo"
              name="promo"
              placeholder="Vaš promo kod..."
              disabled
            />
          </div>

          <button type="submit">Pošalji</button>
        </form>
      </div>
    </main>

    <footer>&copy; Fran Alpeza</footer>
  </body>
</html>
